name: CI (Shared)

# The one definition of the validation gate. It never runs by itself: ci-pr-local.yaml (every PR
# into main) and ci-main-local.yaml (every push to main) each call it with `uses:`, so a PR can
# never be greener than the merge that follows it, and there is no second copy to keep in step.
# Add main-only work (packing, publishing, release tagging) as a new job in ci-main-local.yaml,
# next to its call of this file, rather than as a branch inside these jobs.
#
# Runs on the Windows desktop's Docker runner (label dotnet-10-local). That runner must give job
# containers a RAM-backed /tmp or the suite takes 7 minutes instead of 40 seconds; see
# agents/CIPipeline.md ("Local runner").
#
# The required status check that branch protection waits for is named after the CALLER's workflow
# and job, not this file: renaming a caller workflow, or its job id, strands every PR on a check
# that never reports. Read the exact name off a finished run before changing branch protection.

on:
  workflow_call: {}

jobs:
  # Runs in parallel with the other two jobs, on every PR and every push to main, docs-only or not.
  # The callers have no `paths-ignore`, so a docs-only change reaches this job and the required
  # checks always report (`validate` saves the time instead, by skipping its own steps). Check-DocIndex.ps1 is read-only and needs only git and pwsh; Check-All.ps1
  # is not used here because it runs Check-Eol with -Fix and CI must report, not rewrite the tree.
  # Add further read-only docs checks as steps below.
  docs:
    runs-on: dotnet-10-local
    timeout-minutes: 5
    container:
      # Same image as `secret-scan`; see the note there.
      image: huddle-ci:11.0.100
    defaults:
      run:
        shell: bash

    steps:
      - name: 📥 Checkout
        env:
          GIT_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          AUTH_URL="${GITHUB_SERVER_URL/http:\/\//http:\/\/x-access-token:$GIT_TOKEN@}"
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          git clone --branch "$BRANCH" "$AUTH_URL/$GITHUB_REPOSITORY.git" "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" -c advice.detachedHead=false checkout "$GITHUB_SHA"

      # Fails (exit 1) on MISSING (an Index.md link to a file that does not exist) or UNLISTED
      # (a tracked docs/**/*.md page no Index.md link points at). The last output line is
      # `CHECK-DOCINDEX Missing=<n> Unlisted=<n>`.
      - name: 📚 Doc index lists every page and has no dead links
        run: pwsh -NoProfile -NonInteractive -File ./agents/scripts/Check-DocIndex.ps1

  secret-scan:
    runs-on: dotnet-10-local
    # A hung job must not hold the only runner for the default hours. Needs runner 2.0.0 or newer;
    # an older runner ignores the line.
    timeout-minutes: 10
    container:
      # Built locally on the runner host from .gitea/ci-image/Dockerfile (the stock SDK image plus
      # Node.js and gitleaks), so nothing is downloaded per run. Not in any registry: the runner's
      # config.yaml needs `force_pull: false`. global.json requires 11.0.100 with
      # rollForward=latestPatch, so only an 11.0.1xx SDK satisfies it, and a runner holding a
      # stale :10.0 (10.0.300, which is what failed run 581) dies at restore before any code
      # runs. Rebuild the image and bump this tag together with global.json — one decision.
      image: huddle-ci:11.0.100
    defaults:
      run:
        shell: bash

    steps:
      # No actions/checkout. It is a Node.js action, and it would have to run before the job
      # container is usable; cloning by hand keeps the checkout independent of that.
      - name: 📥 Checkout
        env:
          GIT_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          AUTH_URL="${GITHUB_SERVER_URL/http:\/\//http:\/\/x-access-token:$GIT_TOKEN@}"
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          git clone --branch "$BRANCH" "$AUTH_URL/$GITHUB_REPOSITORY.git" "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" -c advice.detachedHead=false checkout "$GITHUB_SHA"

      - name: 🔎 Scan working tree for secrets
        run: |
          gitleaks dir . \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            --verbose

  validate:
    runs-on: dotnet-10-local
    timeout-minutes: 30
    container:
      # Same image as `secret-scan`; see the note there.
      image: huddle-ci:11.0.100
    defaults:
      run:
        shell: bash

    env:
      # Pinned off, not merely left unset. The E2E/ folder of Huddle.Acp.Tests drives a real
      # adapter against a real model and spends money; E2E.Enabled is `TEAM_E2E == "1"`.
      # Writing "0" here means a runner-level environment variable can never switch it on by
      # accident. Those 8 tests are expected to report as skipped in every CI run.
      TEAM_E2E: "0"

    steps:
      - name: 📥 Checkout
        env:
          GIT_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          AUTH_URL="${GITHUB_SERVER_URL/http:\/\//http:\/\/x-access-token:$GIT_TOKEN@}"
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          git clone --branch "$BRANCH" "$AUTH_URL/$GITHUB_REPOSITORY.git" "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" -c advice.detachedHead=false checkout "$GITHUB_SHA"

      # Decides whether this change can skip restore, build, test and the smoke test. They are
      # skipped as STEPS, not by a `paths-ignore` or a job-level `if:`, so this job still runs and
      # reports success and the required check never strands a docs-only PR. `docs` and
      # `secret-scan` never skip: a docs page can leak a secret as easily as code.
      #
      # code=false only when every changed path is under docs/ (and is not a page a test reads), or
      # is a PowerShell script (*.ps1, *.psm1, *.psd1) outside src/ and tests/. Every project in
      # Huddle.slnx lives under src/ or tests/, and no build file or test reads a script outside
      # them, so run.ps1, installer/, tools/, perf-audit/ and agents/scripts/ change nothing this
      # job checks. The exception is test-health.ps1: the smoke test below runs it. Anything
      # unexpected (no diff base, an empty diff, a git error) runs the full job. When you add a test
      # that reads a file under docs/, add that file to DOCS_READ_BY_TESTS; when a build or test
      # starts running or reading a script outside src/ and tests/, add a case for it above `*.ps1`.
      - name: 🧭 Detect docs- or script-only change
        id: changes
        run: |
          # Read by TeamOptionsDocTests, AgentIsolationMetaTests, PresenceAnchorGoldfishTests and
          # SkillsHelpTests respectively.
          DOCS_READ_BY_TESTS=(
            docs/Huddle.EngineeringGuide.md
            docs/engineering/rules.md
            docs/engineering/design-system.md
            docs/Huddle.UserGuide.md
          )
          code=true
          if [ -n "$GITHUB_BASE_REF" ]; then
            # Pull request: three dots, so only what the PR changed and not what landed on main since.
            range="origin/$GITHUB_BASE_REF...$GITHUB_SHA"
          else
            range="${{ github.event.before }}..$GITHUB_SHA"
          fi
          if changed="$(git diff --name-only "$range" 2>/dev/null)" && [ -n "$changed" ]; then
            code=false
            while IFS= read -r path; do
              case "$path" in
                docs/*) ;;
                src/*|tests/*|test-health.ps1) code=true; break ;;
                *.ps1|*.psm1|*.psd1) ;;
                *) code=true; break ;;
              esac
              for read_by_test in "${DOCS_READ_BY_TESTS[@]}"; do
                if [ "$path" = "$read_by_test" ]; then code=true; break 2; fi
              done
            done <<< "$changed"
          else
            echo "No usable diff for '$range'; running the full job."
          fi
          echo "Changed files:"; echo "${changed:-<none>}"
          echo "code=$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = false ]; then
            echo "::notice::Docs- or script-only change: restore, build, test and smoke test are skipped."
          fi

      # global.json pins SDK 11.0.100 with rollForward=latestPatch, so only an 11.0.1xx SDK
      # satisfies it. A stale huddle-ci image built from an older SDK fails here with "Requested
      # SDK version: 11.0.100 ... Install the [11.0.100] .NET SDK" — rebuild the image, don't
      # debug the code.
      - name: 📦 Restore dependencies
        if: steps.changes.outputs.code == 'true'
        run: dotnet restore Huddle.slnx

      - name: 🔒 Check for vulnerable dependencies
        if: steps.changes.outputs.code == 'true'
        run: |
          dotnet list Huddle.slnx package --vulnerable --include-transitive 2>&1 | tee vuln-scan.log
          if grep -q "has the following vulnerable packages" vuln-scan.log; then
            echo "::error::Vulnerable dependency detected — see log above. Bump the version in Directory.Packages.props (central package management is on, so the version lives only there)."
            exit 1
          fi

      # Directory.Build.props sets TreatWarningsAsErrors, so this step is the style gate too.
      - name: 🛠️ Build solution
        if: steps.changes.outputs.code == 'true'
        run: dotnet build Huddle.slnx --configuration Release --no-restore

      # The trailing `--` is required and is not a typo. Without it this SDK's Microsoft
      # Testing Platform CLI exits 5 with "Zero tests ran", which reads as a no-op rather
      # than a failure. There is deliberately no retry loop: this suite is offline and
      # deterministic, so a retry would hide a real flake instead of surfacing it.
      # Nothing is quarantined. The last two exclusions, DotAcpAgentSessionTests' event-ordering
      # race, went on 2026-11-01, when the ACP client's dispatch barrier (WireOrderLedger) replaced
      # the timing window that only made the race rarer; docs/engineering/known-limits.md has the
      # history. Do not add a --filter-not-method line without a known-limits.md entry.
      - name: 🧪 Run tests
        if: steps.changes.outputs.code == 'true'
        run: |
          dotnet test Huddle.slnx --configuration Release --no-build --

      # Starts the Release build as a real child process, GETs /health over a real socket and
      # prints PASS/FAIL. Deliberately not an xUnit test: every test in tests/Huddle.Tests.Hosted hosts
      # the app in-process through TeamWebApplicationFactory, so none of them can fail when the
      # composed app does not boot as a process - which is the only thing this step asserts.
      # It builds nothing, so it must follow the build step. 120s rather than the script's 60s
      # default: a cold start on a busy runner can be slow.
      # pwsh is at /usr/bin/pwsh in mcr.microsoft.com/dotnet/sdk:11.0.100 (the base of huddle-ci) -
      # PowerShell 7.7.0, installed as a global tool by the image (PowerShell.Linux.amd64 here).
      - name: 🩺 Health endpoint smoke test
        if: steps.changes.outputs.code == 'true'
        run: pwsh -NoProfile -NonInteractive -File ./test-health.ps1 -Configuration Release -TimeoutSeconds 120

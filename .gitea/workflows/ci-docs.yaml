name: CI (Docs)

# Validation for documentation changes. ci-pr-local.yaml and ci-main-local.yaml carry
# `paths-ignore: docs/**`, so a docs-only change never reaches their `validate` job and the
# docs rules (docs/Index.md lists every page under docs/ and links only to files that exist) were
# enforced only by running agents/scripts/Check-All.ps1 by hand. This workflow is the mirror
# image of that filter: it runs when, and only when, docs change.
#
# Deliberately NOT a required status check. A workflow with a positive `paths` filter reports
# nothing on a PR that touches no docs, so requiring it would strand every code-only PR on a
# check that never arrives (the same trap ci-pr-local.yaml's header describes for renames).
# It is a visible red X on docs PRs and on main, not a merge gate.
#
# Check-DocIndex.ps1 is read-only and needs only git and pwsh. Check-All.ps1 is not used here:
# it runs Check-Eol with -Fix (CI must report, not rewrite the tree) and guards agent-workflow
# files that have no place in a CI run. Add further read-only docs checks as steps below.
#
# Runs on the Windows desktop's Docker runner (label dotnet-10-local); see agents/CIPipeline.md
# ("Local runner").

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'

# One runner serves every workflow, so a superseded run is wasted queue time. A push to main is
# never cancelled: each merge's result is worth keeping.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    runs-on: dotnet-10-local
    # The check takes seconds; a hung job must not hold the only runner for the default hours.
    timeout-minutes: 5
    container:
      # Same locally built image as the code workflows (see .gitea/ci-image/Dockerfile). The job
      # needs only git and pwsh, but reusing the tag means the runner pulls and holds nothing new.
      image: huddle-ci:11.0.100
    defaults:
      run:
        shell: bash

    steps:
      # No actions/checkout: it is a Node.js action. Same hand-rolled clone as the other workflows.
      - name: 📥 Checkout
        env:
          GIT_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          AUTH_URL="${GITHUB_SERVER_URL/http:\/\//http:\/\/x-access-token:$GIT_TOKEN@}"
          BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          git clone --branch "$BRANCH" "$AUTH_URL/$GITHUB_REPOSITORY.git" "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" -c advice.detachedHead=false checkout "$GITHUB_SHA"

      # Fails (exit 1) on MISSING (an Index.md link to a file that does not exist) or UNLISTED
      # (a tracked docs/**/*.md page no Index.md link points at). The last output line is
      # `CHECK-DOCINDEX Missing=<n> Unlisted=<n>`.
      - name: 📚 Doc index lists every page and has no dead links
        run: pwsh -NoProfile -NonInteractive -File ./agents/scripts/Check-DocIndex.ps1

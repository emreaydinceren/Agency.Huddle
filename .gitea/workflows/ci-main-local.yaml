name: CI (Main)

# Validation gate for everything that lands on main, whether merged from a PR or pushed
# directly. The checks themselves live in ci-shared.yaml, which ci-pr-local.yaml calls too.
# When main-only work arrives (packing, publishing, release tagging), add it as a new job here,
# `needs: ci`, rather than editing the shared file.

on:
  push:
    branches: [main]
    # No `paths-ignore`; see ci-pr-local.yaml.

# Runs queue, never cancel: each merge's result is worth keeping.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.gitea/workflows/ci-shared.yaml

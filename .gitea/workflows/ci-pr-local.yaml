name: CI (Pull Request)

# Validation gate for every PR into main. The checks themselves live in ci-shared.yaml, which
# ci-main-local.yaml calls too, so a PR can never be greener than the merge that follows it.
#
# The required status check that branch protection waits for is built from THIS file's workflow
# `name` and the job id below (`ci`), plus the called jobs' names. Renaming either strands every
# PR on a check that never reports; read the exact text off a finished run, then update branch
# protection in the same sitting. See agents/CIPipeline.md ("Required status check").

on:
  pull_request:
    branches: [main]
    # No `paths-ignore`: a docs-only PR must still run, so the required checks report and the
    # `docs` job in ci-shared.yaml gets to check it. The `validate` job skips its restore, build,
    # test and smoke-test steps itself when only docs/ changed ("Detect docs-only change").

# One runner serves every workflow, so a superseded run is wasted queue time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.gitea/workflows/ci-shared.yaml

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 780" width="1260" height="780" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <title>Palette map: where each Theme palette property appears, drawn in Huddle Dark's values</title>
  <defs>
    <g id="badge">
      <circle r="11" fill="#d6336c" stroke="#ffffff" stroke-width="2"/>
    </g>
  </defs>
  <rect x="0" y="0" width="1260" height="780" fill="#1c1c1b"/>

  <!-- 1 Surface: the one ground of the page, top bar, sidebar, tab strip and cards -->
  <rect x="20" y="20" width="840" height="740" fill="#262625" stroke="#646461"/>

  <!-- Top bar: Surface, LinesDefault line below -->
  <line x1="20" y1="68.5" x2="860" y2="68.5" stroke="#646461"/>
  <rect x="34" y="36" width="12" height="12" rx="3" fill="none" stroke="#a3a29d" stroke-width="1.5"/>
  <text x="56" y="47" font-size="13" fill="#a3a29d">Rooms  ›</text>
  <text x="108" y="47" font-size="13" fill="#ececea">Launch plan</text>
  <rect x="400" y="30" width="250" height="28" rx="8" fill="#262625" stroke="#454543"/>
  <text x="416" y="49" font-size="13" fill="#a3a29d">Search teams, rooms, tasks…</text>
  <circle cx="826" cy="44" r="8" fill="none" stroke="#a3a29d" stroke-width="1.5"/>
  <path d="M826 36 A8 8 0 0 1 826 52 Z" fill="#a3a29d"/>

  <!-- Sidebar: Surface, LinesDefault right edge; row text DrawerText = TextPrimary, icons DrawerIcon = TextSecondary -->
  <line x1="240.5" y1="69" x2="240.5" y2="760" stroke="#646461"/>
  <rect x="32" y="82" width="196" height="56" rx="8" fill="#262625" stroke="#444442"/>
  <text x="44" y="105" font-size="13" font-weight="600" fill="#ececea">Needs you</text>
  <text x="44" y="125" font-size="12" fill="#a3a29d">2 rooms waiting</text>
  <rect x="34" y="156" width="14" height="12" rx="3" fill="none" stroke="#a3a29d" stroke-width="1.5"/>
  <text x="58" y="167" font-size="14" font-weight="600" fill="#ececea">Rooms</text>
  <path d="M214 160 L218 164 L222 160" fill="none" stroke="#a3a29d" stroke-width="1.5"/>
  <rect x="28" y="176" width="204" height="32" rx="8" fill="#353640"/>
  <text x="48" y="197" font-size="13" fill="#abb0e7">Launch plan</text>
  <text x="48" y="229" font-size="13" fill="#ececea">Design review</text>
  <text x="48" y="261" font-size="13" fill="#ececea">Nova</text>
  <text x="48" y="293" font-size="13" fill="#a3a29d">+  New chat</text>
  <rect x="34" y="324" width="14" height="12" rx="3" fill="none" stroke="#a3a29d" stroke-width="1.5"/>
  <text x="58" y="334" font-size="14" font-weight="600" fill="#ececea">Teams</text>
  <rect x="34" y="356" width="14" height="12" rx="3" fill="none" stroke="#a3a29d" stroke-width="1.5"/>
  <text x="58" y="366" font-size="14" font-weight="600" fill="#ececea">Agents</text>
  <rect x="34" y="388" width="14" height="12" rx="3" fill="none" stroke="#a3a29d" stroke-width="1.5"/>
  <text x="58" y="398" font-size="14" font-weight="600" fill="#ececea">Tasks</text>
  <rect x="34" y="420" width="14" height="12" rx="3" fill="none" stroke="#a3a29d" stroke-width="1.5"/>
  <text x="58" y="430" font-size="14" font-weight="600" fill="#ececea">Library</text>
  <path d="M214 328 L218 332 L222 328" fill="none" stroke="#a3a29d" stroke-width="1.5"/>

  <!-- Tab strip: Surface; active tab has a 2px Primary line on top -->
  <line x1="241" y1="104.5" x2="860" y2="104.5" stroke="#646461"/>
  <rect x="241" y="69" width="150" height="36" fill="#262625"/>
  <rect x="241" y="69" width="150" height="2" fill="#8f97e6"/>
  <text x="258" y="92" font-size="13" font-weight="500" fill="#abb0e7">Launch plan</text>
  <line x1="391.5" y1="69" x2="391.5" y2="104" stroke="#646461"/>
  <text x="408" y="92" font-size="13" font-weight="500" fill="#a3a29d">Tasks</text>
  <line x1="491.5" y1="69" x2="491.5" y2="104" stroke="#646461"/>

  <!-- Room header -->
  <line x1="241" y1="148.5" x2="860" y2="148.5" stroke="#646461"/>
  <text x="260" y="136" font-size="20" font-weight="600" fill="#ececea">Launch plan</text>
  <text x="696" y="132" font-size="12" fill="#a3a29d">3 members</text>
  <circle cx="784" cy="126" r="11" fill="#3b3d4c" stroke="#262625" stroke-width="2"/>
  <text x="784" y="130" font-size="10" font-weight="600" fill="#d5d7e9" text-anchor="middle">N</text>
  <circle cx="808" cy="126" r="11" fill="#3b3d4c" stroke="#262625" stroke-width="2"/>
  <text x="808" y="130" font-size="10" font-weight="600" fill="#d5d7e9" text-anchor="middle">A</text>

  <!-- Day separator: Divider rule, TextSecondary label -->
  <line x1="260" y1="170.5" x2="525" y2="170.5" stroke="#444442"/>
  <text x="550" y="174" font-size="11" fill="#a3a29d" text-anchor="middle">Today</text>
  <line x1="575" y1="170.5" x2="840" y2="170.5" stroke="#444442"/>

  <!-- Agent message: monogram with presence badge, meta, message card -->
  <circle cx="276" cy="206" r="14" fill="#3b3d4c"/>
  <text x="276" y="210" font-size="11" font-weight="600" fill="#d5d7e9" text-anchor="middle">N</text>
  <circle cx="287" cy="217" r="6" fill="#3fbf5a" stroke="#262625" stroke-width="2"/>
  <path d="M284.5 217 L286.5 219 L289.5 215.5" fill="none" stroke="#262625" stroke-width="1.2"/>
  <text x="300" y="199" font-size="12" font-weight="600" fill="#ececea">Nova</text>
  <text x="336" y="199" font-size="12" fill="#a3a29d">· 10:42</text>
  <rect x="300" y="208" width="420" height="70" rx="8" fill="#262625" stroke="#444442"/>
  <text x="316" y="234" font-size="14" fill="#ececea">The launch checklist is ready. Two items need</text>
  <text x="316" y="256" font-size="14" fill="#ececea">your call before Friday, see</text>
  <text x="494" y="256" font-size="14" fill="#abb0e7" text-decoration="underline">Launch checklist</text>

  <!-- Human bubble: Primary 14% over Surface, border 28% -->
  <rect x="520" y="296" width="320" height="44" rx="8" fill="#353640" stroke="#43465b"/>
  <text x="536" y="323" font-size="14" fill="#ececea">Great, I'll review it this afternoon.</text>

  <!-- Agent card: Surface, LinesDefault border; filled button, outlined button, tinted chip, quiet chip -->
  <rect x="300" y="358" width="420" height="118" rx="8" fill="#262625" stroke="#646461"/>
  <text x="316" y="384" font-size="14" font-weight="600" fill="#ececea">Nova is asking</text>
  <rect x="604" y="370" width="70" height="20" rx="10" fill="#403828"/>
  <text x="639" y="384" font-size="12" font-weight="500" fill="#e4b972" text-anchor="middle">Review</text>
  <text x="316" y="408" font-size="13" fill="#a3a29d">Ship the beta to the pilot group on Friday?</text>
  <rect x="316" y="436" width="88" height="28" rx="8" fill="#8f97e6"/>
  <text x="360" y="455" font-size="14" font-weight="500" fill="#000000" text-anchor="middle">Approve</text>
  <rect x="412" y="436" width="80" height="28" rx="8" fill="none" stroke="#5a5e86"/>
  <text x="452" y="455" font-size="14" font-weight="500" fill="#abb0e7" text-anchor="middle">Decline</text>
  <rect x="624" y="440" width="64" height="22" rx="11" fill="#2a2a29"/>
  <text x="656" y="455" font-size="12" fill="#ececea" text-anchor="middle">beta</text>

  <!-- Activity line: TextSecondary -->
  <circle cx="276" cy="510" r="14" fill="#3b3d4c"/>
  <text x="276" y="514" font-size="11" font-weight="600" fill="#d5d7e9" text-anchor="middle">N</text>
  <text x="300" y="507" font-size="12" font-weight="600" fill="#ececea">Nova</text>
  <text x="300" y="527" font-size="12" fill="#a3a29d">Reading launch-checklist.md…</text>

  <!-- Composer: Surface, LinesInputs border (Primary when focused), TextSecondary placeholder -->
  <rect x="260" y="690" width="580" height="52" rx="8" fill="#262625" stroke="#454543"/>
  <text x="276" y="721" font-size="14" fill="#a3a29d">Message Launch plan…</text>
  <circle cx="816" cy="716" r="13" fill="#8f97e6"/>
  <path d="M816 723 V710 M810 715 L816 709 L822 715" fill="none" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Badges -->
  <g font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">
    <use href="#badge" x="560" y="620"/><text x="560" y="624">1</text>
    <use href="#badge" x="440" y="68"/><text x="440" y="72">2</text>
    <use href="#badge" x="222" y="192"/><text x="222" y="196">3</text>
    <use href="#badge" x="394" y="199"/><text x="394" y="203">4</text>
    <use href="#badge" x="340" y="71"/><text x="340" y="75">5</text>
    <use href="#badge" x="720" y="240"/><text x="720" y="244">6</text>
    <use href="#badge" x="690" y="228"/><text x="690" y="232">7</text>
    <use href="#badge" x="404" y="440"/><text x="404" y="444">8</text>
    <use href="#badge" x="260" y="192"/><text x="260" y="196">9</text>
    <use href="#badge" x="840" y="296"/><text x="840" y="300">10</text>
    <use href="#badge" x="840" y="690"/><text x="840" y="694">11</text>
    <use href="#badge" x="296" y="228"/><text x="296" y="232">12</text>
    <use href="#badge" x="604" y="380"/><text x="604" y="384">13</text>
    <use href="#badge" x="690" y="451"/><text x="690" y="455">14</text>
  </g>

  <!-- Legend -->
  <text x="890" y="44" font-size="15" font-weight="700" fill="#ececea">Palette map</text>
  <text x="890" y="64" font-size="12" fill="#a3a29d">Drawn in Huddle Dark's own values</text>
  <g font-size="12" fill="#ececea">
    <use href="#badge" x="900" y="94"/><text x="900" y="98" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">1</text>
    <rect x="918" y="86" width="16" height="16" rx="3" fill="#262625" stroke="#646461"/>
    <text x="942" y="98"><tspan font-weight="600">Surface</tspan> — every pane and card ground</text>
    <use href="#badge" x="900" y="132"/><text x="900" y="136" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">2</text>
    <rect x="918" y="124" width="16" height="16" rx="3" fill="#646461" stroke="#646461"/>
    <text x="942" y="136"><tspan font-weight="600">LinesDefault</tspan> — chrome lines, card outline</text>
    <use href="#badge" x="900" y="170"/><text x="900" y="174" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">3</text>
    <rect x="918" y="162" width="16" height="16" rx="3" fill="#8f97e6" stroke="#646461"/>
    <text x="942" y="174"><tspan font-weight="600">Primary</tspan> — accent text, links</text>
    <use href="#badge" x="900" y="208"/><text x="900" y="212" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">4</text>
    <rect x="918" y="200" width="16" height="16" rx="3" fill="#a3a29d" stroke="#646461"/>
    <text x="942" y="212"><tspan font-weight="600">TextSecondary</tspan> — meta, idle tabs, placeholder</text>
    <use href="#badge" x="900" y="246"/><text x="900" y="250" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">5</text>
    <rect x="918" y="238" width="16" height="16" rx="3" fill="#8f97e6" stroke="#646461"/>
    <text x="942" y="250"><tspan font-weight="600">Primary</tspan> — tab line, focused border</text>
    <use href="#badge" x="900" y="284"/><text x="900" y="288" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">6</text>
    <rect x="918" y="276" width="16" height="16" rx="3" fill="#444442" stroke="#646461"/>
    <text x="942" y="288"><tspan font-weight="600">Divider</tspan> — card borders, separators</text>
    <use href="#badge" x="900" y="322"/><text x="900" y="326" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">7</text>
    <rect x="918" y="314" width="16" height="16" rx="3" fill="#ececea" stroke="#646461"/>
    <text x="942" y="326"><tspan font-weight="600">TextPrimary</tspan> — body text, focus ring</text>
    <use href="#badge" x="900" y="360"/><text x="900" y="364" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">8</text>
    <rect x="918" y="352" width="16" height="16" rx="3" fill="#8f97e6" stroke="#646461"/>
    <text x="942" y="364"><tspan font-weight="600">Primary</tspan> — button + PrimaryContrastText</text>
    <use href="#badge" x="900" y="398"/><text x="900" y="402" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">9</text>
    <rect x="918" y="390" width="16" height="16" rx="3" fill="#3b3d4c" stroke="#646461"/>
    <text x="942" y="402"><tspan font-weight="600">Primary 20%</tspan> — avatar monogram</text>
    <use href="#badge" x="900" y="436"/><text x="900" y="440" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">10</text>
    <rect x="918" y="428" width="16" height="16" rx="3" fill="#353640" stroke="#646461"/>
    <text x="942" y="440"><tspan font-weight="600">Primary 14%</tspan> — your bubble, selected row</text>
    <use href="#badge" x="900" y="474"/><text x="900" y="478" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">11</text>
    <rect x="918" y="466" width="16" height="16" rx="3" fill="#454543" stroke="#646461"/>
    <text x="942" y="478"><tspan font-weight="600">LinesInputs</tspan> — Composer border at rest</text>
    <use href="#badge" x="900" y="512"/><text x="900" y="516" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">12</text>
    <rect x="918" y="504" width="5" height="16" fill="#3fbf5a"/><rect x="923" y="504" width="6" height="16" fill="#e0a33e"/><rect x="929" y="504" width="5" height="16" fill="#e05a5a"/>
    <text x="942" y="516"><tspan font-weight="600">Success, Warning, Error</tspan> — presence, status</text>
    <use href="#badge" x="900" y="550"/><text x="900" y="554" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">13</text>
    <rect x="918" y="542" width="16" height="16" rx="3" fill="#403828" stroke="#646461"/>
    <text x="942" y="554"><tspan font-weight="600">Warning 14%</tspan> — tinted status chip</text>
    <use href="#badge" x="900" y="588"/><text x="900" y="592" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">14</text>
    <rect x="918" y="580" width="16" height="16" rx="3" fill="#2a2a29" stroke="#646461"/>
    <text x="942" y="592"><tspan font-weight="600">BackgroundGray</tspan> — quiet chip</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 780" width="1260" height="780" font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
  <title>Palette map: where each Theme palette property appears, drawn in Huddle Light's values</title>
  <defs>
    <g id="badge">
      <circle r="11" fill="#d6336c" stroke="#ffffff" stroke-width="2"/>
    </g>
  </defs>
  <rect x="0" y="0" width="1260" height="780" fill="#ffffff"/>

  <!-- 1 Background: the page ground -->
  <rect x="20" y="20" width="840" height="740" fill="#f2f0ed" stroke="#d4d3d1"/>

  <!-- 2 Top bar: DrawerBackground 50% over Surface -->
  <rect x="20" y="20" width="840" height="48" fill="#f3f1ee"/>
  <line x1="20" y1="68.5" x2="860" y2="68.5" stroke="#d4d3d1"/>
  <text x="36" y="50" font-size="15" font-weight="700" fill="#141413">Huddle</text>
  <text x="260" y="49" font-size="13" fill="#45443f">Chats  ›</text>
  <text x="318" y="49" font-size="13" fill="#141413">Launch plan</text>
  <rect x="470" y="30" width="250" height="28" rx="8" fill="#ffffff" stroke="#e0e0df"/>
  <text x="484" y="49" font-size="13" fill="#8a8882">Search</text>
  <circle cx="826" cy="44" r="8" fill="none" stroke="#45443f" stroke-width="1.5"/>
  <path d="M826 36 A8 8 0 0 1 826 52 Z" fill="#45443f"/>

  <!-- 4 Sidebar: DrawerBackground -->
  <rect x="20" y="69" width="220" height="691" fill="#e6e2dc"/>
  <line x1="240.5" y1="69" x2="240.5" y2="760" stroke="#d4d3d1"/>
  <rect x="32" y="82" width="196" height="56" rx="8" fill="#ffffff" stroke="#e5e5e4"/>
  <text x="44" y="105" font-size="13" font-weight="600" fill="#141413">Needs you</text>
  <text x="44" y="125" font-size="12" fill="#45443f">2 rooms waiting</text>
  <text x="36" y="166" font-size="11" font-weight="600" letter-spacing="0.8" fill="#45443f">CHATS</text>
  <rect x="28" y="176" width="204" height="32" rx="8" fill="#ddd9d3"/>
  <text x="48" y="197" font-size="13" font-weight="600" fill="#6e78da">Launch plan</text>
  <text x="48" y="229" font-size="13" fill="#141413">Design review</text>
  <text x="48" y="261" font-size="13" fill="#141413">Nova</text>
  <text x="48" y="293" font-size="13" font-weight="600" fill="#6e78da">+  New chat</text>
  <text x="36" y="334" font-size="11" font-weight="600" letter-spacing="0.8" fill="#45443f">TEAMS</text>
  <circle cx="40" cy="357" r="4" fill="#2e9e44"/>
  <text x="52" y="361" font-size="13" fill="#141413">Platform</text>
  <circle cx="40" cy="389" r="4" fill="#c77d00"/>
  <text x="52" y="393" font-size="13" fill="#141413">Research</text>
  <circle cx="40" cy="421" r="4" fill="#b32121"/>
  <text x="52" y="425" font-size="13" fill="#141413">Operations</text>

  <!-- 7 Tab strip: BackgroundGray; 8 active tab Surface; 9 accent line Primary -->
  <rect x="241" y="69" width="619" height="36" fill="#e5e2e0"/>
  <line x1="241" y1="104.5" x2="860" y2="104.5" stroke="#d4d3d1"/>
  <rect x="241" y="69" width="150" height="36" fill="#ffffff"/>
  <rect x="241" y="69" width="150" height="2" fill="#6e78da"/>
  <text x="258" y="92" font-size="13" fill="#141413">Launch plan</text>
  <line x1="391.5" y1="69" x2="391.5" y2="104" stroke="#d4d3d1"/>
  <text x="408" y="92" font-size="13" fill="#45443f">Tasks</text>
  <line x1="491.5" y1="69" x2="491.5" y2="104" stroke="#d4d3d1"/>

  <!-- Room header -->
  <line x1="241" y1="148.5" x2="860" y2="148.5" stroke="#d4d3d1"/>
  <text x="260" y="132" font-size="15" font-weight="600" fill="#141413">Launch plan</text>
  <text x="690" y="131" font-size="12" fill="#45443f">3 members</text>
  <circle cx="790" cy="126" r="11" fill="#6e78da"/>
  <text x="790" y="130" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">N</text>
  <circle cx="814" cy="126" r="11" fill="#6e78da" stroke="#f2f0ed" stroke-width="2"/>
  <text x="814" y="130" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">A</text>

  <!-- 10 Day separator: Divider line, TextSecondary label -->
  <line x1="260" y1="170.5" x2="525" y2="170.5" stroke="#e5e5e4"/>
  <text x="550" y="174" font-size="11" fill="#45443f" text-anchor="middle">Today</text>
  <line x1="575" y1="170.5" x2="840" y2="170.5" stroke="#e5e5e4"/>

  <!-- Agent message: avatar, meta, message card -->
  <circle cx="276" cy="206" r="14" fill="#6e78da"/>
  <text x="276" y="211" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">N</text>
  <text x="300" y="199" font-size="12" font-weight="600" fill="#141413">Nova</text>
  <text x="336" y="199" font-size="12" fill="#45443f">· 10:42</text>
  <rect x="300" y="208" width="420" height="70" rx="8" fill="#ffffff" stroke="#e5e5e4"/>
  <text x="316" y="234" font-size="13" fill="#141413">The launch checklist is ready. Two items need</text>
  <text x="316" y="256" font-size="13" fill="#141413">your call before Friday, see</text>
  <text x="497" y="256" font-size="13" fill="#6e78da" text-decoration="underline">Launch checklist</text>

  <!-- 13 Human bubble: Primary 14% over Surface, border 28% -->
  <rect x="520" y="296" width="320" height="44" rx="8" fill="#ebecfa" stroke="#d6d9f5"/>
  <text x="536" y="323" font-size="13" fill="#141413">Great, I'll review it this afternoon.</text>

  <!-- Agent card: outlined paper (Surface, LinesDefault border) -->
  <rect x="300" y="358" width="420" height="118" rx="8" fill="#ffffff" stroke="#d4d3d1"/>
  <text x="316" y="384" font-size="14" font-weight="600" fill="#141413">Nova is asking</text>
  <text x="316" y="408" font-size="13" fill="#45443f">Ship the beta to the pilot group on Friday?</text>
  <rect x="316" y="436" width="88" height="28" rx="8" fill="#6e78da"/>
  <text x="360" y="455" font-size="13" font-weight="500" fill="#ffffff" text-anchor="middle">Approve</text>
  <rect x="412" y="436" width="80" height="28" rx="8" fill="none" stroke="#a8aee9"/>
  <text x="452" y="455" font-size="13" font-weight="500" fill="#6e78da" text-anchor="middle">Decline</text>
  <rect x="624" y="440" width="64" height="22" rx="11" fill="#e5e2e0"/>
  <text x="656" y="455" font-size="12" fill="#141413" text-anchor="middle">beta</text>

  <!-- 17 Draft row: tool activity in TextDisabled -->
  <circle cx="276" cy="510" r="14" fill="#6e78da"/>
  <text x="276" y="515" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">N</text>
  <text x="300" y="507" font-size="12" font-weight="600" fill="#141413">Nova</text>
  <text x="300" y="527" font-size="12" fill="#8a8882">Reading launch-checklist.md…</text>

  <!-- 14 Composer: Surface, LinesInputs border, TextDisabled placeholder -->
  <rect x="260" y="690" width="580" height="52" rx="8" fill="#ffffff" stroke="#e0e0df"/>
  <text x="276" y="721" font-size="13" fill="#8a8882">Message Launch plan…</text>
  <circle cx="816" cy="716" r="13" fill="#6e78da"/>
  <path d="M816 723 V710 M810 715 L816 709 L822 715" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Badges -->
  <g font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">
    <use href="#badge" x="560" y="610"/><text x="560" y="614">1</text>
    <use href="#badge" x="200" y="44"/><text x="200" y="48">2</text>
    <use href="#badge" x="440" y="68"/><text x="440" y="72">3</text>
    <use href="#badge" x="130" y="600"/><text x="130" y="604">4</text>
    <use href="#badge" x="218" y="192"/><text x="218" y="196">5</text>
    <use href="#badge" x="96" y="162"/><text x="96" y="166">6</text>
    <use href="#badge" x="720" y="87"/><text x="720" y="91">7</text>
    <use href="#badge" x="720" y="208"/><text x="720" y="212">8</text>
    <use href="#badge" x="370" y="72"/><text x="370" y="76">9</text>
    <use href="#badge" x="490" y="170"/><text x="490" y="174">10</text>
    <use href="#badge" x="700" y="234"/><text x="700" y="238">11</text>
    <use href="#badge" x="404" y="436"/><text x="404" y="440">12</text>
    <use href="#badge" x="840" y="296"/><text x="840" y="300">13</text>
    <use href="#badge" x="840" y="690"/><text x="840" y="694">14</text>
    <use href="#badge" x="140" y="389"/><text x="140" y="393">15</text>
    <use href="#badge" x="688" y="440"/><text x="688" y="444">16</text>
    <use href="#badge" x="490" y="522"/><text x="490" y="526">17</text>
  </g>

  <!-- Legend -->
  <text x="890" y="44" font-size="15" font-weight="700" fill="#141413">Palette map</text>
  <text x="890" y="64" font-size="12" fill="#45443f">Drawn in Huddle Light's own values</text>
  <g font-size="12" fill="#141413">
    <use href="#badge" x="900" y="94"/><text x="900" y="98" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">1</text>
    <rect x="918" y="86" width="16" height="16" rx="3" fill="#f2f0ed" stroke="#999"/><text x="942" y="98"><tspan font-weight="600">Background</tspan> — the page ground</text>

    <use href="#badge" x="900" y="132"/><text x="900" y="136" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">2</text>
    <rect x="918" y="124" width="16" height="16" rx="3" fill="#f3f1ee" stroke="#999"/><text x="942" y="136"><tspan font-weight="600">Top bar</tspan> — DrawerBackground 50% + Surface</text>

    <use href="#badge" x="900" y="170"/><text x="900" y="174" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">3</text>
    <rect x="918" y="162" width="16" height="16" rx="3" fill="#d4d3d1" stroke="#999"/><text x="942" y="174"><tspan font-weight="600">LinesDefault</tspan> — chrome lines, card outline</text>

    <use href="#badge" x="900" y="208"/><text x="900" y="212" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">4</text>
    <rect x="918" y="200" width="16" height="16" rx="3" fill="#e6e2dc" stroke="#999"/><text x="942" y="212"><tspan font-weight="600">DrawerBackground</tspan> — the sidebar</text>

    <use href="#badge" x="900" y="246"/><text x="900" y="250" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">5</text>
    <rect x="918" y="238" width="16" height="16" rx="3" fill="#6e78da" stroke="#999"/><text x="942" y="250"><tspan font-weight="600">Primary</tspan> — active nav link, links</text>

    <use href="#badge" x="900" y="284"/><text x="900" y="288" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">6</text>
    <rect x="918" y="276" width="16" height="16" rx="3" fill="#45443f" stroke="#999"/><text x="942" y="288"><tspan font-weight="600">TextSecondary</tspan> — headings, meta, idle tabs</text>

    <use href="#badge" x="900" y="322"/><text x="900" y="326" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">7</text>
    <rect x="918" y="314" width="16" height="16" rx="3" fill="#e5e2e0" stroke="#999"/><text x="942" y="326"><tspan font-weight="600">BackgroundGray</tspan> — the tab strip</text>

    <use href="#badge" x="900" y="360"/><text x="900" y="364" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">8</text>
    <rect x="918" y="352" width="16" height="16" rx="3" fill="#ffffff" stroke="#999"/><text x="942" y="364"><tspan font-weight="600">Surface</tspan> — cards, active tab, inputs</text>

    <use href="#badge" x="900" y="398"/><text x="900" y="402" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">9</text>
    <rect x="918" y="390" width="16" height="16" rx="3" fill="#6e78da" stroke="#999"/><text x="942" y="402"><tspan font-weight="600">Primary</tspan> — the active tab's top line</text>

    <use href="#badge" x="900" y="436"/><text x="900" y="440" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">10</text>
    <rect x="918" y="428" width="16" height="16" rx="3" fill="#e5e5e4" stroke="#999"/><text x="942" y="440"><tspan font-weight="600">Divider</tspan> — card borders, separators</text>

    <use href="#badge" x="900" y="474"/><text x="900" y="478" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">11</text>
    <rect x="918" y="466" width="16" height="16" rx="3" fill="#141413" stroke="#999"/><text x="942" y="478"><tspan font-weight="600">TextPrimary</tspan> — body text, focus ring</text>

    <use href="#badge" x="900" y="512"/><text x="900" y="516" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">12</text>
    <rect x="918" y="504" width="16" height="16" rx="3" fill="#6e78da" stroke="#999"/><text x="942" y="516"><tspan font-weight="600">Primary</tspan> fill + <tspan font-weight="600">PrimaryContrastText</tspan></text>

    <use href="#badge" x="900" y="550"/><text x="900" y="554" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">13</text>
    <rect x="918" y="542" width="16" height="16" rx="3" fill="#ebecfa" stroke="#d6d9f5"/><text x="942" y="554"><tspan font-weight="600">Your bubble</tspan> — Primary 14% over Surface</text>

    <use href="#badge" x="900" y="588"/><text x="900" y="592" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">14</text>
    <rect x="918" y="580" width="16" height="16" rx="3" fill="#e0e0df" stroke="#999"/><text x="942" y="592"><tspan font-weight="600">LinesInputs</tspan> border, TextDisabled hint</text>

    <use href="#badge" x="900" y="626"/><text x="900" y="630" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">15</text>
    <rect x="918" y="618" width="5" height="16" fill="#2e9e44"/><rect x="923" y="618" width="6" height="16" fill="#c77d00"/><rect x="929" y="618" width="5" height="16" fill="#b32121"/><text x="942" y="630"><tspan font-weight="600">Success, Warning, Error</tspan> — status</text>

    <use href="#badge" x="900" y="664"/><text x="900" y="668" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">16</text>
    <rect x="918" y="656" width="16" height="16" rx="3" fill="#e5e2e0" stroke="#999"/><text x="942" y="668"><tspan font-weight="600">BackgroundGray</tspan> — chips, quiet fills</text>

    <use href="#badge" x="900" y="702"/><text x="900" y="706" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">17</text>
    <rect x="918" y="694" width="16" height="16" rx="3" fill="#8a8882" stroke="#999"/><text x="942" y="706"><tspan font-weight="600">TextDisabled</tspan> — tool activity, inert text</text>
  </g>
</svg>

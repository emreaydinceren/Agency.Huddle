<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" role="img" aria-labelledby="t d">
<title id="t">The Teammate card and its Spend line</title>
<desc id="d">Three Teammate cards in view mode: one with a Spend line, one for a local model with no Spend line, and one with two currencies.</desc>
<style>
.bg{fill:#ffffff}.panel{fill:#f6f7f9;stroke:#d5d9e0}.card{fill:#ffffff;stroke:#d5d9e0}.code{fill:#f0f2f5;stroke:#d5d9e0}
.ink{fill:#1f2328}.mut{fill:#6a737d}.ok{fill:#1a7f37}.run{fill:#0969da}.fail{fill:#cf222e}
.addbg{fill:#e6f4ea}.rembg{fill:#fdecea}.addbar{fill:#1a7f37}.rembar{fill:#cf222e}.btn{fill:#ffffff;stroke:#cf222e}
.avatar{fill:#0969da}.white{fill:#ffffff}.rule{stroke:#d5d9e0;fill:none}.note{fill:none;stroke:#0969da;stroke-dasharray:4 3}
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:13px}.s{font-size:12px}.b{font-weight:600}.h{font-size:15px;font-weight:600}
@media (prefers-color-scheme:dark){
.bg{fill:#0d1117}.panel{fill:#161b22;stroke:#30363d}.card{fill:#0d1117;stroke:#30363d}.code{fill:#161b22;stroke:#30363d}
.ink{fill:#e6edf3}.mut{fill:#8b949e}.ok{fill:#3fb950}.run{fill:#58a6ff}.fail{fill:#ff7b72}
.addbg{fill:#12261a}.rembg{fill:#2d1517}.addbar{fill:#3fb950}.rembar{fill:#ff7b72}.btn{fill:#0d1117;stroke:#ff7b72}
.avatar{fill:#1f6feb}.rule{stroke:#30363d}.note{fill:none;stroke:#58a6ff;stroke-dasharray:4 3}}
</style>
<rect class="bg" width="760" height="330"/>

<text class="mut s b" x="20" y="26">VIEW MODE · THE SPEND LINE IS ONE LINE PER CURRENCY, AND ABSENT WHEN NOTHING WAS REPORTED</text>

<!-- card 1 -->
<rect class="card" x="20" y="44" width="228" height="200" rx="8"/>
<text class="ink h" x="36" y="72">Nova</text>
<text class="mut s" x="36" y="92">Researcher</text>
<circle class="ok" cx="42" cy="114" r="5"/><text class="ink" x="54" y="119">Online</text>
<rect class="note" x="30" y="132" width="208" height="26" rx="4"/>
<text class="ink s" x="38" y="149">Spent since start: 0.091 USD</text>
<text class="mut s" x="36" y="184">Alias: nov</text>
<text class="mut s" x="36" y="204">Teams: Research</text>
<text class="mut s b" x="134" y="266" text-anchor="middle">Spend reported</text>

<!-- card 2 -->
<rect class="card" x="266" y="44" width="228" height="200" rx="8"/>
<text class="ink h" x="282" y="72">Scout</text>
<text class="mut s" x="282" y="92">Local model</text>
<circle class="ok" cx="288" cy="114" r="5"/><text class="ink" x="300" y="119">Online</text>
<text class="mut s" x="282" y="184">Alias: sco</text>
<text class="mut s" x="282" y="204">Teams: Research</text>
<text class="mut s b" x="380" y="266" text-anchor="middle">No cost reported: no line, never a zero</text>

<!-- card 3 -->
<rect class="card" x="512" y="44" width="228" height="200" rx="8"/>
<text class="ink h" x="528" y="72">Relay</text>
<text class="mut s" x="528" y="92">Two adapters</text>
<circle class="ok" cx="534" cy="114" r="5"/><text class="ink" x="546" y="119">Online</text>
<rect class="note" x="522" y="132" width="208" height="42" rx="4"/>
<text class="ink s" x="530" y="149">Spent since start: 0.400 USD</text>
<text class="ink s" x="530" y="166">Spent since start: 1.250 EUR</text>
<text class="mut s" x="528" y="200">Alias: rel</text>
<text class="mut s" x="528" y="220">Teams: Ops</text>
<text class="mut s b" x="626" y="266" text-anchor="middle">Two currencies, never added together</text>

<text class="mut s" x="20" y="300">A dashed outline marks what is new. In edit mode the line is hidden: the form is for changing the Teammate.</text>
</svg>

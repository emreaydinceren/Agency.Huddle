name: Release

# Builds, verifies and publishes the Agency Huddle installer release.
#
# How it starts: by hand. Nothing is ever pushed to GitHub directly. Gitea main is the source of
# truth and GitHub main is a scrubbed mirror updated by .gitea/workflows/sync-github.yaml; the
# mirror carries main only, so a v* tag would not exist here. A maintainer runs this workflow from
# the Actions tab after a sync. The version goes up by itself: left empty, it is the latest tag
# with its patch number bumped (or minor/major, see `bump`); typed in, it must be newer than every
# existing tag. `publish` creates the release AND its tag from the exact commit that was built
# (--target "$GITHUB_SHA").
#
# This file reaches GitHub only through the sync, so it cannot be exercised before the first one.
# Jobs: version -> build (matrix: win-x64, win-arm64, osx-arm64) -> assemble ->
# smoke-windows + smoke-windows-arm64 + smoke-macos -> publish. Each build is installed for real
# on a runner of its own CPU, and the release exists only after all three pass. Intel Macs are not
# supported, so there is no osx-x64 build.
# No signing steps and no secrets other than github.token.
# Every third-party action is pinned to a full commit SHA with its tag in a trailing comment.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Leave empty for the next version, or type one without the v prefix (1.0.0, 1.1.0-rc.1); it must be newer than the latest'
        required: false
        default: ''
        type: string
      bump:
        description: 'Which number goes up when the version is left empty'
        required: false
        default: patch
        type: choice
        options: [patch, minor, major]

# No permissions by default; each job asks for exactly what it needs.
permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Decides the version before anything is built, so a bad or stale version fails in seconds.
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.next.outputs.version }}
    env:
      INPUT_VERSION: ${{ inputs.version }}
      BUMP: ${{ inputs.bump }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check the ref
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::run this workflow from main (got $GITHUB_REF): the mirror carries main only"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      # installer/next-version.sh: no input bumps the latest v* tag; an input must be newer than it.
      - name: Next version
        id: next
        run: |
          set -o pipefail
          args=(--bump "${BUMP:-patch}")
          if [[ -n "$INPUT_VERSION" ]]; then
            args+=(--version "$INPUT_VERSION")
          fi
          version=$(gh api "repos/$GH_REPO/tags" --paginate --jq '.[].name' | sh installer/next-version.sh "${args[@]}")
          echo "Release version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.rid }})
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        rid: [win-x64, win-arm64, osx-arm64]
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Build release archive
        env:
          RID: ${{ matrix.rid }}
        run: sh installer/build-release.sh --version "$VERSION" --rid "$RID" --out dist

      - name: Upload archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.rid }}
          path: dist
          if-no-files-found: error

  assemble:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Download archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      # The installers carry the literal __HUDDLE_REPO__ exactly once, as the default repository.
      # The published copies get this repository's name; the checked-in files are left untouched.
      - name: Stamp the repository into the installers
        run: |
          sed "s|__HUDDLE_REPO__|${GITHUB_REPOSITORY}|g" installer/install.ps1 > dist/install.ps1
          sed "s|__HUDDLE_REPO__|${GITHUB_REPOSITORY}|g" installer/install.sh > dist/install.sh
          if grep -F '__HUDDLE_REPO__' dist/install.ps1 dist/install.sh; then
            echo "::error::the __HUDDLE_REPO__ placeholder is still present in a published installer"
            exit 1
          fi
          for installer in dist/install.ps1 dist/install.sh; do
            if ! grep -qF "${GITHUB_REPOSITORY}" "$installer"; then
              echo "::error::$installer does not contain ${GITHUB_REPOSITORY} after the rewrite"
              exit 1
            fi
          done

      - name: Write checksums
        run: sh installer/make-sums.sh dist huddle-win-x64.zip huddle-win-arm64.zip huddle-osx-arm64.tar.gz install.ps1 install.sh

      - name: List release files
        run: ls -l dist

      # Skipped in a private repository, where attestations are not available.
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Upload release files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          path: dist
          if-no-files-found: error

  # smoke.ps1 tests the build install.ps1 picks for the runner's CPU: win-x64 here.
  smoke-windows:
    needs: assemble
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Download release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist

      # Windows PowerShell 5.1 on purpose: that is what users run.
      - name: Smoke test
        shell: pwsh
        env:
          EXPECTED_REPO: ${{ github.repository }}
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File installer/tests/smoke.ps1 -ReleaseDir dist -ExpectedRepo $env:EXPECTED_REPO

  # The same smoke test on a Windows ARM64 runner, so it installs and runs the native win-arm64 build.
  smoke-windows-arm64:
    needs: assemble
    runs-on: windows-11-arm
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Download release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist

      - name: Smoke test
        shell: pwsh
        env:
          EXPECTED_REPO: ${{ github.repository }}
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File installer/tests/smoke.ps1 -ReleaseDir dist -ExpectedRepo $env:EXPECTED_REPO

  # smoke.sh picks the build from the runner's CPU: osx-arm64 here (Apple Silicon).
  smoke-macos:
    needs: assemble
    runs-on: macos-latest
    continue-on-error: false
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Download release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist

      - name: Smoke test
        run: sh installer/tests/smoke.sh dist

  publish:
    needs: [version, smoke-windows, smoke-windows-arm64, smoke-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Re-checked here so this job never trusts an unvalidated string, whatever the graph above says.
      - name: Validate version
        run: |
          pattern='^[0-9]+\.[0-9]+\.[0-9]+([-+.][0-9A-Za-z.]+)*$'
          if [[ ! "$VERSION" =~ $pattern ]]; then
            echo "::error::version '$VERSION' is not a release version such as 1.0.0 or 1.0.0-rc.1"
            exit 1
          fi

      - name: Download release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist

      # The tag does not exist yet (the mirror carries no tags), and re-running for a published
      # version must fail loudly rather than add files to, or move the tag of, a finished release.
      - name: Refuse an existing release or tag
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "::error::release v$VERSION already exists; pick a new version or delete that release and its tag first"
            exit 1
          fi
          if gh api "repos/$GH_REPO/git/ref/tags/v$VERSION" > /dev/null 2>&1; then
            echo "::error::tag v$VERSION already exists without a release; delete the tag or pick a new version"
            exit 1
          fi

      # --target creates the tag from the commit that was built. A version with a suffix
      # (1.0.0-rc.1) is a pre-release, so releases/latest keeps pointing at the last full release.
      - name: Create release
        run: |
          flags=()
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+- ]]; then
            flags+=(--prerelease)
          fi
          gh release create "v$VERSION" dist/* --target "$GITHUB_SHA" --generate-notes --title "Agency Huddle $VERSION" "${flags[@]}"
